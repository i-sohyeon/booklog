<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7F7F8">
<title>연결이 끊겼어요 · 북로그</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #F7F7F8; color: #18181B; font-family: Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; text-align: center; }
  main { max-width: 320px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  img { width: 64px; height: 64px; margin-bottom: 8px; }
  h1 { margin: 0; font-size: 20px; }
  p { margin: 0; font-size: 15px; line-height: 1.6; color: #52525B; }
  button { margin-top: 12px; min-height: 48px; padding: 0 28px; border: 0; border-radius: 999px; background: #5B2590; color: #fff; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>인터넷 연결이 끊겼어요</h1>
  <p>와이파이나 데이터 연결을 확인한 뒤 다시 시도해 주세요. 연결되면 바로 이어서 쓸 수 있어요.</p>
  <button type="button" onclick="location.reload()">다시 시도</button>
</main>
</body>
</html>
