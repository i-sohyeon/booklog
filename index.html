    <title>BookLog · 북로그</title>
    <!-- 스플래시: 앱이 준비될 때까지 보이는 시작 화면 (src/main.tsx 에서 걷어 냄) -->
    <style>
      /* 홈 화면 앱으로 열 때만 보여요 (브라우저에선 안 보임) */
      #splash { display: none; }
      @media (display-mode: standalone) {
        #splash { display: flex; }
      }
      html.standalone #splash { display: flex; }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        padding-bottom: 6vh;
        background: #5b2590;
        color: #fbf8f3;
        font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
        transition: opacity 0.3s ease-out, visibility 0.3s;
      }
      #splash.is-done { opacity: 0; visibility: hidden; animation: none; }
      #splash .mark {
        width: 96px;
        height: 96px;
      }
      #splash .word {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      #splash .word strong { font-size: 30px; font-weight: 700; letter-spacing: -0.5px; }
      #splash .word strong span { color: #e3a94b; }
      #splash .word em { font-style: normal; font-size: 15px; font-weight: 500; color: rgba(251, 248, 243, 0.72); }
    </style>
  </head>
  <body>
    <script>if (navigator.standalone) document.documentElement.classList.add('standalone');</script>
    <div id="splash" aria-hidden="true">
      <svg class="mark" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><rect width="32" height="32" rx="8" fill="#fbf8f3"/><path d="M9 8.5h6.2c2.6 0 4.3 1.3 4.3 3.4 0 1.4-.8 2.4-2 2.9 1.6.4 2.6 1.6 2.6 3.2 0 2.4-1.9 3.9-4.7 3.9H9z" fill="#5b2590"/><circle cx="23" cy="20.5" r="1.6" fill="#e3a94b"/></svg>
      <div class="word"><strong>Book<span>Log</span></strong><em>나의 독서 생활을 기록하는 곳</em></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
