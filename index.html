<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F7F8" />
    <!-- iOS가 이메일·전화번호를 자동으로 밑줄 링크로 바꾸지 않게 -->
    <meta name="format-detection" content="telephone=no, email=no, address=no" />
    <meta name="description" content="북로그 — 나의 독서 생활을 기록하고, 함께 나누는 공간" />

    <!-- 링크 공유 미리보기 (카카오톡·페이스북 등: og / X: twitter) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BookLog · 북로그" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:url" content="https://booklog-azure.vercel.app/" />
    <meta property="og:title" content="BookLog · 북로그" />
    <meta property="og:description" content="나의 독서 생활을 기록하고, 함께 나누는 공간" />
    <meta property="og:image" content="https://booklog-azure.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="BookLog · 북로그 — 나의 독서 생활을 기록하고, 함께 나누는 공간" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BookLog · 북로그" />
    <meta name="twitter:description" content="나의 독서 생활을 기록하고, 함께 나누는 공간" />
    <meta name="twitter:image" content="https://booklog-azure.vercel.app/og-image.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- 앱으로 쓰기 (PWA): 홈 화면 아이콘·전체 화면 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="북로그" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <title>BookLog · 북로그</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
